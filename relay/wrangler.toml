# Wonder Wars online relay. Deployed by the GitHub workflows (scripts/online-relay.sh) when the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are set. Runs on Cloudflare's free plan.
name = "wonder-wars-relay"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
